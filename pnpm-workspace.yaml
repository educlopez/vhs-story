# Supply-chain hardening (see the supply-chain-security skill).
# Cooldown: skip packages published less than 2 days ago.
minimumReleaseAge: 2880

# Block transitive deps from git repos or raw tarball URLs.
blockExoticSubdeps: true

# Only these packages may run install/build scripts.
allowBuilds:
  # Fallback download; the native binary comes as an optional dependency.
  unrs-resolver: false

# Security overrides: patched versions only, inside the current major.
overrides:
  "ajv@6": ">=6.15.0 <7"
  "brace-expansion@1": ">=1.1.21 <2"
  "brace-expansion@2": ">=2.1.7 <3"
  "cross-spawn@7": ">=7.0.6 <8"
  "flatted@3": ">=3.4.4 <4"
  "glob@10": ">=10.5.0 <11"
  "js-yaml@4": ">=4.3.2 <5"
  "micromatch@4": ">=4.0.8 <5"
  "micromatch>picomatch": "2.3.2"
  "minimatch@3": ">=3.1.5 <4"
  "minimatch@9": ">=9.0.9 <10"
  "nanoid@3": ">=3.3.20 <4"
  "next>postcss": ">=8.5.31 <9"
  "postcss-selector-parser@6": ">=6.1.5 <7"
  "source-map-js@1": ">=1.2.2 <2"
  "yaml@2": ">=2.8.3 <3"
  "eslint-import-resolver-typescript@3": ">=3.10.1 <4"
  "anymatch>picomatch": "2.3.2"
  "readdirp>picomatch": "2.3.2"
